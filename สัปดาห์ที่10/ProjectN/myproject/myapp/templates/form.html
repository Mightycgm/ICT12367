{% extends 'base.html' %}
{% block title %}
<title>แบบฟอร์มข้อมูลประชากร</title>
{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow">
      <!-- Header -->
      <div class="card-header bg-primary text-white text-center py-3">
        <h4 class="mb-0"><i class="bi bi-person-lines-fill me-2"></i>แบบฟอร์มบันทึกข้อมูลประชากร</h4>
      </div>
      <!-- Body -->
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="fullname" class="form-label fw-bold">ชื่อประชากร</label>
            <input
              type="text"
              class="form-control"
              id="fullname"
              name="fullname"
              placeholder="กรุณากรอกชื่อ-นามสกุล" />
          </div>
          <div class="mb-3">
            <label for="age" class="form-label fw-bold">อายุ</label>
            <input
              type="number"
              class="form-control"
              id="age"
              name="age"
              placeholder="กรอกข้อมูลอายุเป็นตัวเลข" />
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-check-circle me-1"></i>ลงทะเบียน
            </button>
            <button type="reset" class="btn btn-danger">
              <i class="bi bi-x-circle me-1"></i>ล้างข้อมูล
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
