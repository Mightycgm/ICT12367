<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แบบฟอร์มข้อเสนอแนะ - บริษัท ศุมปะที จำกัด</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');
        body {
            background-color: #f8f9fa;
            font-family: 'Sarabun', sans-serif;
        }

        .form-container {
            margin: 40px auto;
            background: #fff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .char-counter {
            font-size: 0.9rem;
            color: #6c757d;
            margin-top: 5px;
        }

        footer {
            background-color: #343a40;
            color: #fff;
            padding: 20px 0;
            margin-top: 40px;
            
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div class="container mt-4 mb-3">
        <h1 class="text-center">📝 แบบฟอร์มข้อเสนอแนะ</h1>
        <p class="text-center text-muted">บริษัท ศุมปะที จำกัด - กรุณาแสดงความคิดเห็นหรือข้อเสนอแนะของคุณ</p>
    </div>

    <div class="container grow">
        <div class="form-container">
            <form id="feedbackForm">
                <div class="mb-3">
                    <label for="customerName" class="form-label">ชื่อ-นามสกุล</label>
                    <input type="text" class="form-control" id="customerName" placeholder="กรอกชื่อ-นามสกุล" required>
                </div>

                <div class="mb-3">
                    <label for="customerEmail" class="form-label">อีเมล</label>
                    <input type="email" class="form-control" id="customerEmail" placeholder="กรอกอีเมล" required>
                </div>

                <div class="mb-3">
                    <label for="feedbackMessage" class="form-label">ข้อความร้องเรียน / ข้อเสนอแนะ</label>
                    <textarea class="form-control" id="feedbackMessage" rows="5" placeholder="พิมพ์ข้อความของคุณที่นี่..." required></textarea>
                    <div class="char-counter">
                        จำนวนตัวอักษร: <span id="charCount">0</span> ตัว
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100">ส่งข้อเสนอแนะ</button>
            </form>
        </div>
    </div>

    <footer class="text-center mt-auto">
        <p>&copy; 2026 บริษัท ศุมปะที จำกัด - สงวนลิขสิทธิ์</p>
        <p>จัดทำโดย: ณชาศิลป์ นาเคณฑ์ | รหัสนักศึกษา: 68040402</p>
    </footer>

    <script>
        const feedbackMessage = document.getElementById('feedbackMessage');
        const charCount = document.getElementById('charCount');

        feedbackMessage.addEventListener('input', function () {
            const currentLength = feedbackMessage.value.length;
            charCount.textContent = currentLength;
        });

        const feedbackForm = document.getElementById('feedbackForm');
        feedbackForm.addEventListener('submit', function (e) {
            e.preventDefault();
            alert('ขอบคุณสำหรับข้อเสนอแนะของคุณ!');
            feedbackForm.reset();
            charCount.textContent = '0';
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
