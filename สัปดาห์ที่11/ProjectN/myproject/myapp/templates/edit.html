{% extends 'base.html' %}
{% block title %}
<title>แก้ไขข้อมูลประชากร</title>
{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow">
      <!-- Header -->
      <div class="card-header bg-warning text-dark text-center py-3">
        <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>แก้ไขข้อมูลประชากร</h4>
      </div>
      <!-- Body -->
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label for="fullname" class="form-label fw-bold">ชื่อประชากร</label>
            <input
              type="text"
              class="form-control"
              id="fullname"
              name="fullname"
              value="{{person.name}}"
              placeholder="กรุณากรอกชื่อ-นามสกุล" />
          </div>
          <div class="mb-3">
            <label for="age" class="form-label fw-bold">อายุ</label>
            <input
              type="number"
              class="form-control"
              id="age"
              name="age"
              value="{{person.age}}"
              placeholder="กรอกข้อมูลอายุเป็นตัวเลข" />
          </div>
          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-warning">
              <i class="bi bi-check-circle me-1"></i>บันทึกการแก้ไข
            </button>
            <a href="{% url 'index' %}" class="btn btn-secondary">
              <i class="bi bi-arrow-left me-1"></i>ย้อนกลับ
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
